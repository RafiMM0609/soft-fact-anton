<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}}{{else}}Factory App{{end}}</title>
  <script src="/assets/htmx.min.js"></script>
  <script>
    htmx.config.useTemplateFragments = true;
    // Enable HTMX to swap 4xx and 5xx responses (validation errors, 404, 409, 422, 500 error fragments targeted at #form-error or OOB)
    document.addEventListener('htmx:beforeOnLoad', function (evt) {
      if (evt.detail.xhr.status >= 400 && evt.detail.xhr.status < 600) {
        evt.detail.shouldSwap = true;
        evt.detail.isError = false;
      }
    });
  </script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --border: #334155;
      --error: #ef4444;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 1rem;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header.site-header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #app-title { font-size: 1.25rem; font-weight: 600; color: var(--primary); }
    #app-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9375rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      transition: color 150ms ease, background 150ms ease;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--text);
      background: var(--bg);
    }
    main#main-content {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 0.875rem; color: var(--text-muted); }
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      outline: 2px solid var(--primary);
    }
    button, .btn {
      display: inline-block;
      padding: 10px 18px;
      font-size: 0.9375rem;
      font-weight: 500;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background 150ms ease;
    }
    button:hover, .btn:hover { background: var(--primary-hover); }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.75rem;
      background: #0284c7;
      color: white;
    }
    #form-error, .form-error {
      color: var(--error);
      font-size: 0.875rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div style="display: flex; align-items: center; gap: 24px;">
      <h1 id="app-title">{{if .Title}}{{.Title}}{{else}}Factory App{{end}}</h1>
      <nav id="app-nav">
        {{block "nav" .}}
        <a href="/" class="nav-link">Home</a>
        {{end}}
      </nav>
    </div>
    <span class="badge">Go + HTMX Active</span>
  </header>

  <main id="main-content">
    <div id="form-error" role="alert"></div>
    {{block "content" .}}
    <div class="card">
      <h3>Sistem Siap Digunakan</h3>
      <p style="color: var(--text-muted); margin-top: 8px;">
        Aplikasi Fullstack Go + HTMX + SQLite telah aktif.
      </p>
    </div>
    {{end}}
  </main>
</body>
</html>
